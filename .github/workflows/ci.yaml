name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" != 'ShaoxinLi/COLA' ]]; then
            echo '::error::CI requires a branch in ShaoxinLi/COLA. Fork pull requests cannot access the private checker.'
            exit 1
          fi
      - name: Run private checks
        env:
          COLA_CI_HOST: ${{ secrets.COLA_CI_HOST }}
          COLA_CI_SSH_KEY: ${{ secrets.COLA_CI_SSH_KEY }}
          COLA_CI_KNOWN_HOSTS: ${{ secrets.COLA_CI_KNOWN_HOSTS }}
          REQUEST: >-
            ${{ github.event_name == 'pull_request'
              && format('pr {0} {1}', github.event.pull_request.number, github.event.pull_request.head.sha)
              || format('push main {0}', github.sha) }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${COLA_CI_HOST:?Missing COLA_CI_HOST}"
          : "${COLA_CI_SSH_KEY:?Missing COLA_CI_SSH_KEY}"
          : "${COLA_CI_KNOWN_HOSTS:?Missing COLA_CI_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/cola-ci.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$COLA_CI_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$COLA_CI_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$GH_TOKEN" | ssh -T -i "$ssh_dir/key" \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "cola-ci@$COLA_CI_HOST" "$REQUEST"
