name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork-policy:
    name: Fork policy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '::error::Self-hosted CI requires a branch in this repository. Do not approve fork workflows onto these runners.'
          exit 1

  check:
    name: Rust checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, cola-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (v6)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check Rust
        run: bash ci/check.sh
